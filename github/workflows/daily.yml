name: Daily Top
on:
  schedule:
    - cron: "50 20 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANGABUFF_SESSION: ${{ secrets.MANGABUFF_SESSION }}
          XSRF_TOKEN: ${{ secrets.XSRF_TOKEN }}
          CLUB_URL: ${{ secrets.CLUB_URL }}
          MODE: daily
        run: python bot.py
