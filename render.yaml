services:
  - type: web
    name: mangabuff-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: BOT_TOKEN
      - key: CHAT_ID
      - key: FULL_COOKIE
      - key: CLUB_SLUG
        value: utinoe-bratstvo
      - key: MODE
        value: all
      - key: RUN_KEY
        generateValue: true
      - key: PROXY
        sync: false
